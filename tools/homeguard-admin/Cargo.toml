[package]
name = "homeguard-admin"
version = "0.1.0"
edition = "2021"
description = "Administração do alarme ESP32 Homeguard pelo terminal: configurações, OTA e gravação por USB"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
if-addrs = "0.13"
crossterm = "0.28"
espflash = { version = "4", default-features = false, features = ["serialport"] }
serialport = { version = "4.7", default-features = false }
mdns-sd = "0.13"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
strip = true
lto = true
